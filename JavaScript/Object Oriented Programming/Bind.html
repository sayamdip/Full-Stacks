<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bind Concept</title>
    <style>
        body{
            background-color:rgb(109, 84, 51);
        }
    </style>
</head>
<body>
    <button>Button Clicked</button>
</body>
<script>
    class React{
        constructor(){
            this.library = "React"
            this.server = "http://localhost:3000"

            // Requirement
            document.querySelector("button").addEventListener("click", this.handleClick.bind(this))

        }
        handleClick(){
            console.log("Button Clicked")
            console.log(this);
            
        }

    }
    const app = new React()
</script>
</html>
